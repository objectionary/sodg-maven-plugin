---
# yamllint disable rule:line-length
name: markdown-lint
'on':
  push:
    branches:
      - master
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
jobs:
  markdown-lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: articulate/actions-markdownlint@v1
