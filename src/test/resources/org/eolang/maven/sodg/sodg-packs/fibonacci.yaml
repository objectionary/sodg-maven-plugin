---
# yamllint disable rule:line-length
sheets: []
input: |
  +architect yegor256@gmail.com
  +home https://github.com/objectionary/sodg-maven-plugin
  +package org.eolang.sodg.examples
  +version 0.0.0
  +spdx SPDX-FileCopyrightText Copyright (c) 2016-2025 Objectionary.com
  +spdx SPDX-License-Identifier: MIT

  # Fibonacci numbers
  [n] > fibonacci
    if. > @
      lt
        n
        2
      n
      plus.
        ^.fibonacci
          n.minus 1
        ^.fibonacci
          n.minus 2
asserts:
  - //sodg/i[@name='application']
  - //sodg[not(i[@name='application' and count(a)!=4])]
  - //sodg[not(i[@name='put' and count(a)!=3])]
  - //sodg[not(i/a[normalize-space(.)=''])]
  - //sodg[every $ref in i[@name=('delta','lambda')]/a[1] satisfies $ref = i[@name=('formation','dispatch','application')]/a[1]]
  - //sodg[every $ref in i[@name='dispatch']/a[2] satisfies $ref = i[@name=('formation','dispatch','application')]/a[1]]
  - //sodg[every $ref in i[@name='application']/a[position()=(2,4)] satisfies $ref = i[@name=('formation','dispatch','application')]/a[1]]
  - //sodg[every $ref in i[@name='put']/a[position()=(1,3)] satisfies $ref = i[@name=('formation','dispatch','application')]/a[1]]
  - //sodg[count(i[@name='application'])=9 and count(i[@name='delta'])=3 and count(i[@name='put'])=1]
  - //sodg[count(i[@name=('formation','dispatch','application')])=count(distinct-values(i[@name=('formation','dispatch','application')]/a[1]))]
  - //sodg/i[@name='dispatch' and a[1]='b4' and a[2]='b5-app2' and a[3]='if']
  - //sodg/i[@name='application' and a[1]='b5-app2' and a[2]='b5-app1' and a[3]='α1' and a[4]='b7']
  - //sodg/i[@name='application' and a[1]='b4-app2' and a[2]='b4-app1' and a[3]='α1' and a[4]='b11-app1']
  - //sodg/i[@name='dispatch' and a[1]='b11' and a[2]='b12-app1' and a[3]='plus']
  - //sodg/i[@name='application' and a[1]='b12-app1' and a[2]='b12' and a[3]='α0' and a[4]='b13-app1']
  - //sodg/i[@name='application' and a[1]='b18-app1' and a[2]='b18' and a[3]='α0' and a[4]='b19']
  - //sodg/i[@name='put' and a[1]='b1' and a[2]='φ' and a[3]='b4-app2']
