---
# yamllint disable rule:line-length
sheets: []
input: |
  [] > foo
    [] > bar
      [] > baz
        [] > buz
          [] > boom /number
asserts:
  - //sodg/i[@name='formation' and count(a)=2 and a[1][text()='b1'] and a[2][text()='bar']]
  - //sodg/i[@name='formation' and count(a)=2 and a[1][text()='b2'] and a[2][text()='baz']]
  - //sodg/i[@name='formation' and count(a)=2 and a[1][text()='b3'] and a[2][text()='buz']]
  - //sodg/i[@name='formation' and count(a)=2 and a[1][text()='b4'] and a[2][text()='boom']]
  - //sodg/i[@name='formation' and count(a)=1 and a[1][text()='b5']]
  - //sodg/i[@name='lambda' and count(a)=2 and a[1][text()='b5'] and a[2][text()='boom']]
  - //sodg[not(i[@name='dispatch'])]
