---
# yamllint disable rule:line-length
sheets: []
input: |
  [] > head
    [] > second
      [a b c] > third
        [] > tail
asserts:
  - //sodg/i[@name='formation' and count(a)=2 and a[1][text()='b1'] and a[2][text()='second']]
  - //sodg/i[@name='formation' and count(a)=2 and a[1][text()='b2'] and a[2][text()='third']]
  - //sodg/i[@name='formation' and count(a)=5 and a[1][text()='b3'] and a[2][text()='a'] and a[3][text()='b'] and a[4][text()='c'] and a[5][text()='tail']]
  - //sodg/i[@name='dispatch' and count(a)=3 and a[1][text()='b4'] and a[2][text()='b3'] and a[3][text()='a']]
  - //sodg/i[@name='dispatch' and count(a)=3 and a[1][text()='b5'] and a[2][text()='b3'] and a[3][text()='b']]
  - //sodg/i[@name='dispatch' and count(a)=3 and a[1][text()='b6'] and a[2][text()='b3'] and a[3][text()='c']]
  - //sodg/i[@name='formation' and count(a)=1 and a[1][text()='b7']]
  - //sodg[count(i[@name='dispatch'])=3]
